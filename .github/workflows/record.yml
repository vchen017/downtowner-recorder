name: record

# Each run polls every 5 minutes for ~5h40m, committing after every poll, then
# queues the next run. The cron (every 30 min) is a backup in case that fails.
# The concurrency group below keeps at most one run active and one waiting.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: recorder
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RECORDER_DAILY: "1"
      RECORDER_RAW: "0"
    steps:
      # Without ref, a run that waited in the queue checks out the commit from
      # when it was queued, behind the data the previous run pushed meanwhile.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Poll every 5 minutes and commit
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Push every save GitHub doesn't have yet. A save that fails to push stays
          # committed here and goes up with the next poll, instead of being dropped.
          # Each git call to GitHub gets 20 seconds, so a stalled one can't make the
          # loop miss the next 5-minute mark.
          push_saves() {
            for try in 1 2 3; do
              if timeout 20 git fetch -q origin main; then
                if ! git rebase -q origin/main; then
                  # Only this job writes the data files, so this shouldn't happen.
                  git rebase --abort
                  echo "::warning::Couldn't rebase onto main; dropped $(git rev-list --count origin/main..HEAD) unpushed save(s)"
                  git reset -q --hard origin/main
                  return 1
                fi
                timeout 20 git push -q origin HEAD:main && return 0
              fi
              [ $try = 3 ] || sleep 10
            done
            echo "::warning::Push failed 3 times; $(git rev-list --count origin/main..HEAD) save(s) will go up with the next poll"
            return 1
          }
          # Tell healthchecks.io that a new save reached GitHub. It emails when these stop.
          ping_healthchecks() {
            [ -n "$HEALTHCHECKS_URL" ] || return 0
            curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECKS_URL" || echo "::warning::Couldn't reach healthchecks.io"
          }
          end=$((SECONDS + 340*60))
          while [ $SECONDS -lt $end ]; do
            sleep $(( 300 - $(date +%s) % 300 ))   # wait for the next 5-minute mark
            python3 record_buses.py --once || true
            git add data
            if git commit -qm "data $(date -u +%FT%TZ)"; then
              push_saves && ping_healthchecks || true
            else
              push_saves || true   # nothing new this time, but push any earlier saves
            fi
          done
          push_saves || true   # one last try, so the run doesn't end holding saves
      - name: Queue the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run record.yml --ref main
